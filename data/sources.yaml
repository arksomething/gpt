version: 1
updated_utc: "2026-07-27"

policy:
  registry_scope: unlimited
  max_active_inspection_sources: 25
  generated_data_root: data/source_samples
  statuses:
    - candidate
    - quarantined
    - inspecting
    - accepted
    - rejected
  redistribution:
    - redistributable
    - train_only
    - permission_required
    - excluded
  review:
    quick_documents: 12
    deep_documents_boutique: 40
    deep_documents_trunk: 100
    artifact_clean_min_fraction: 0.80
    quality_pass_min_fraction: 0.70
    synthetic_suspicion_max_fraction: 0.05
    max_repetitions: 4
    boutique_max_anneal_fraction: 0.10
    author_max_boutique_source_fraction: 0.20
    rationalist_cluster_max_boutique_fraction: 0.25

sources:
  gwern:
    name: Gwern.net essays
    tier: A
    status: inspecting
    redistribution: redistributable
    license: CC0-1.0
    license_url: https://gwern.net/about#license
    homepage: https://gwern.net/
    roles: [analytical_essay, technical_explanation, long_form]
    acquisition:
      enabled: true
      kind: sitemap_html
      sitemap_url: https://gwern.net/sitemap.xml
      robots_url: https://gwern.net/robots.txt
      include_prefix: https://gwern.net/
      exclude_substrings: [/doc/, /newsletter/, /changelog, /index, /about]

  standard_ebooks:
    name: Standard Ebooks
    tier: A
    status: inspecting
    redistribution: redistributable
    license: CC0-1.0
    license_url: https://standardebooks.org/about/standard-ebooks-and-the-public-domain
    homepage: https://standardebooks.org/
    roles: [literature, long_form, edited_book]
    acquisition:
      enabled: true
      kind: github_org_epubs
      organization: standardebooks
      api_url: https://api.github.com/orgs/standardebooks/repos

  public_domain_review:
    name: Public Domain Review essays
    tier: A
    status: inspecting
    redistribution: redistributable
    license: CC-BY-SA-4.0
    license_url: https://publicdomainreview.org/about/
    homepage: https://publicdomainreview.org/
    roles: [edited_essay, cultural_history, narrative_explanation]
    notes: Exclude embedded book excerpts whose terms differ from the article.
    acquisition:
      enabled: true
      kind: huggingface
      dataset_id: common-pile/public_domain_review
      split: train
      text_fields: [text]

  our_world_in_data:
    name: Our World in Data articles
    tier: A
    status: inspecting
    redistribution: redistributable
    license: CC-BY-4.0
    license_url: https://ourworldindata.org/faqs
    homepage: https://ourworldindata.org/
    roles: [data_explanation, factual_exposition, edited_article]
    notes: Exclude third-party passages, charts, and data with separate terms.
    acquisition:
      enabled: true
      kind: sitemap_html
      sitemap_url: https://ourworldindata.org/sitemap.xml
      robots_url: https://ourworldindata.org/robots.txt
      include_prefix: https://ourworldindata.org/
      exclude_substrings: [/grapher/, /explorers/, /search, /subscribe, /about, /team]

  crs_reports:
    name: Congressional Research Service reports
    tier: A
    status: inspecting
    redistribution: redistributable
    license: US-Public-Domain
    license_url: https://www.everycrsreport.com/download.html
    homepage: https://www.everycrsreport.com/
    roles: [policy_analysis, factual_exposition, professional_report]
    notes: Remove or separately review incorporated third-party copyrighted material.
    acquisition:
      enabled: true
      kind: crs_csv
      index_url: https://www.everycrsreport.com/reports.csv
      base_url: https://www.everycrsreport.com/

  plos:
    name: PLOS research articles
    tier: A
    status: inspecting
    redistribution: redistributable
    license: CC-BY-4.0
    license_url: https://plos.org/terms-of-use/
    homepage: https://plos.org/
    roles: [academic_prose, scientific_explanation, evidence_reporting]
    acquisition:
      enabled: true
      kind: plos_api
      api_url: https://api.plos.org/search

  common_pile_doab:
    name: Common Pile DOAB open-access books
    tier: A
    status: inspecting
    redistribution: redistributable
    license: per-document-open-license
    license_url: https://huggingface.co/datasets/common-pile/doab
    homepage: https://www.doabooks.org/
    roles: [modern_book, academic_monograph, long_form]
    acquisition:
      enabled: true
      kind: huggingface
      dataset_id: common-pile/doab
      split: train
      text_fields: [text]

  common_pile_gutenberg:
    name: Common Pile Project Gutenberg
