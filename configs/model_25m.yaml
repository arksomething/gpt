ladder:
  name: 25m
  target_parameters: 25000000
  role: data_probe

model:
  vocab_size: 32000
  hidden_size: 384
  intermediate_size: 1024
  num_hidden_layers: 8
  num_attention_heads: 6
  num_key_value_heads: 2
  max_position_embeddings: 4096
  rms_norm_eps: 1.0e-5
  rope_theta: 10000.0
  hidden_act: silu
  attention_bias: false
  mlp_bias: false
  tie_word_embeddings: true
  pad_token_id: 3
  bos_token_id: 1
  eos_token_id: 2
