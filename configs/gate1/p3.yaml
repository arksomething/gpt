# Gate 1 arm p3: STEM 17->27, paid from DCLM and Edu
# Generated by scripts/gate1_arms.py -- edit the table there.
data:
  block_size: 1024
  dtype: uint16
  indexed:
    enabled: true
    train_dir: data/gate1/union-v1/train
    val_dir: data/gate1/union-v1/validation
    tokenizer_sha256: null
    recipe_sha256: null
    verify_hashes: true
    source_weights:
      finepdfs: 0.2
      fineweb: 0.23
      dclm: 0.1
      stackexchange: 0.055
      youtube: 0.025
      ubuntu_irc: 0.015
      github_archive: 0.015
      uk_hansard: 0.01
      finemath: 0.1271
      code: 0.1429
      narrative: 0.03
      wiki: 0.02
      wikiteam: 0.02
      libretexts: 0.01
    validation_source_weights: null
  streaming:
    enabled: false
data_prep:
  tokenizer_model: tokenizer/spm.model
training:
  seed: 1337
  micro_batch_size: 8
  grad_accum_steps: 8
  learning_rate: 0.0006
  weight_decay: 0.1
  betas:
  - 0.9
  - 0.95
  warmup_steps: 190
  max_steps: 3815
  eval_interval: 190
  log_interval: 10
  save_interval: 380
  output_dir: runs/gate1/p3
  precision: bf16
  max_grad_norm: 1.0
  gradient_checkpointing: false
  allow_tf32: true
  checkpoint_limit: 2
checkpoint_slots:
  best: 2
  good:
  - mixture_candidate
checkpoint_upload:
  enabled: false
  repo_id: null
  local_checkpoint_mode: persistent
  keep_local_final: true
  retry_max_attempts: 3
  retry_backoff_seconds: 5
  verify_upload: true
  retention:
    enabled: false
    keep_latest: 2
    keep_best: 2
logging:
  enabled: true
  console_summary: true
  log_file: auto
  tensorboard:
    enabled: false
  wandb:
    enabled: false
observability:
  enabled: true
  heartbeat_interval_steps: 10
  state_file: run_state.json
  events_file: events.jsonl
  metrics_file: metrics.jsonl
  budget_alarm_fractions:
  - 0.5
  - 0.8
  - 0.95
runtime_control:
  enabled: true
  poll_interval_steps: 10
  cursor_path: null
  allowed_updates:
  - training.eval_interval
  - training.save_interval
  - training.log_interval
  - checks.fixed_prompt.enabled
budget:
  target_tokens: 250000000
  hourly_rate: 0.0
  max_cost: 0.0
  throughput_path: runs/gate1/p3/throughput.json
checks:
  source_eval:
    enabled: true
    batches: 20
  overfit_microset:
    enabled: true
    tokens: 1000000
    steps: 100
    eval_batches: 20
    min_drop: 0.3
    warmup_steps: 0
    log_interval: 10
    run_on_smoke: false
  fixed_prompt:
    enabled: false
    run_on_smoke: false
