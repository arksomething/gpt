# First paid-probe template. Planning and synthetic smoke tests are safe; do
# not execute the three-seed group until the indexed corpus paths below exist
# and the experiment plan has been reviewed.
data:
  block_size: 1024
  dtype: uint16
  indexed:
    enabled: true
    train_dir: data/probes/writing-v1/train
    val_dir: data/probes/writing-v1/validation
    tokenizer_sha256: null
    recipe_sha256: null
    verify_hashes: true
    source_weights: null
    validation_source_weights: null
  streaming:
    enabled: false

data_prep:
  tokenizer_model: tokenizer/spm.model

training:
  seed: 1337
  micro_batch_size: 8
  grad_accum_steps: 8
  learning_rate: 6.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  warmup_steps: 190
  max_steps: 3815  # 250,019,840 tokens on one process
  eval_interval: 190
  log_interval: 10
  save_interval: 380
  output_dir: runs/probes/25m-placeholder
  precision: bf16
  max_grad_norm: 1.0
  gradient_checkpointing: false
  allow_tf32: true
  checkpoint_limit: 2

checkpoint_slots:
  best: 2
  good: [mixture_candidate]

checkpoint_upload:
  enabled: false
  repo_id: null
  local_checkpoint_mode: persistent
  keep_local_final: true
  retry_max_attempts: 3
  retry_backoff_seconds: 5
  verify_upload: true
  retention:
    enabled: false
    keep_latest: 2
    keep_best: 2

logging:
  enabled: true
  console_summary: true
  log_file: auto
  tensorboard:
    enabled: false
  wandb:
    enabled: false

observability:
  enabled: true
  heartbeat_interval_steps: 10
  state_file: run_state.json
  events_file: events.jsonl
  metrics_file: metrics.jsonl
  budget_alarm_fractions: [0.50, 0.80, 0.95]

runtime_control:
  enabled: true
  poll_interval_steps: 10
  cursor_path: null
  allowed_updates:
    - training.eval_interval
    - training.save_interval
    - training.log_interval
    - checks.fixed_prompt.enabled

budget:
  target_tokens: 250000000
  hourly_rate: 0.0  # Must be filled from the selected provider quote
  max_cost: 0.0     # Must be explicitly authorized before execution
  throughput_path: runs/throughput-25m.json

checks:
  source_eval:
    enabled: true
    batches: 20
  overfit_microset:
    enabled: true
    tokens: 1000000
    steps: 100
    eval_batches: 20
    min_drop: 0.3
    warmup_steps: 0
    log_interval: 10
    run_on_smoke: false
  fixed_prompt:
    enabled: false
    run_on_smoke: false
