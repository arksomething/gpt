data:
  train_bin: data/v3/train.bin
  val_bin: data/v3/val.bin
  block_size: 2048
  dtype: uint16
  vocab_size: 32000
  hf_repo: null  # Optional HF pre-tokenized dataset; must match tokenizer exactly
  
  # Streaming mode - load data directly from HuggingFace without storing locally
  streaming:
    enabled: false  # Set to true to enable streaming
    hf_repo: ark296/gpt-training-data-tokenized  # HF dataset with pre-tokenized data
    train_split: train
    buffer_size: 10000  # Shuffle buffer size
    prefetch_batches: 10  # Batches to prefetch in background

data_prep:
  tokenizer_model: tokenizer/spm.model
  out_dir: data/v3
  train_tokens: 2000000000
  val_tokens: 20000000
  
  # Active source weights (should sum to ~1.0 across enabled sources)
  c4_weight: 0.30
  wiki_weight: 0.50
  fineweb_weight: 0.20
  # Backward-compatible alias; ignored when fineweb_weight is set.
  gutenberg_weight: 0.00
  
  shuffle_buffer: 1000
  seed: 1337
  log_interval: 30
  tokenizer_workers: 4
  tokenizer_prefetch: 256
  
  # Global filter parameters (G0-G5)
  min_chars: 300
  max_chars: 80000
  min_alpha_ratio: 0.65
  max_repeated_chars: 6
  max_weird_ratio: 0.01
  max_short_line_ratio: 0.30
  max_caps_ratio: 0.20
  
  # C4-specific filter parameters (C1-C6)
  c4_min_alpha_ratio: 0.70
  c4_max_punct_ratio: 0.20
  c4_min_entropy: 3.5
  c4_max_entropy: 5.6
  
  # Wikipedia-specific (W1)
  wiki_max_list_ratio: 0.20
  
  # FineWeb-specific (currently no-op; reserved for future tuning)
  fineweb_filter_poetry: false
  # Backward-compatible alias
  gutenberg_filter_poetry: false
  
  # Deduplication (G6)
  dedup_enabled: true
  dedup_similarity_threshold: 0.85
  dedup_num_perm: 128
  
  # Chunking
  max_chunk_chars: 8000
  min_chunk_chars: 500

eval:
  checkpoint: runs/llama-100m-v3/final
  tokenizer_model: tokenizer/spm.model
  batches: 200
  prompt: "The quick brown fox"
  min_new_tokens: 16
  max_new_tokens: 100
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1

inference:
  checkpoint: runs/llama-100m-v3/final
  model_config: configs/model_100m.yaml
  tokenizer: tokenizer/spm.model
  max_tokens: 100
  temperature: 0.7
  top_p: 0.9
  top_k: 40
  repetition_penalty: 1.1  # 1.0=none, 1.05-1.2=gentle
  device: auto  # auto, cuda, or cpu

tokenizer_training:
  output_dir: tokenizer
  vocab_size: 32000
  # Note: Uses c4/wiki/fineweb weights from data_prep.
  min_chars: 200
  max_chars: 50000000
  shuffle_buffer: 1000
  seed: 1337

training:
  seed: 1337
  micro_batch_size: 4
  grad_accum_steps: 32
  learning_rate: 2.0e-4
  weight_decay: 0.1
  betas: [0.9, 0.95]
  warmup_steps: 400
  max_steps: 15260
  eval_interval: 200
  log_interval: 50
  save_interval: 500
  output_dir: runs/llama-100m-v3
  precision: bf16
  max_grad_norm: 1.0
  gradient_checkpointing: true
  allow_tf32: true
  checkpoint_limit: 1  # Keep only 1 local checkpoint to save disk space

checkpoint_slots:
  best: 0
  good: []

checkpoint_upload:
  enabled: true  # Requires HF_TOKEN or huggingface-cli login
  repo_id: ark296/llama-100m-v3-checkpoints
  upload_interval: 1000  # Upload every N steps (ignored in ephemeral mode; every save uploads)
  upload_optimizer: true  # Kept for compatibility; exact-resume mode uploads full checkpoint folders
  local_checkpoint_mode: ephemeral  # persistent|ephemeral (ephemeral keeps local checkpoints only until upload succeeds)
  keep_local_final: false  # Keep local final checkpoint after successful upload
  retry_max_attempts: 3
  retry_backoff_seconds: 5
  verify_upload: true
  resume_from_hf: null  # Optional: latest|best|final|step_XXXXXXX
  retention:
    enabled: true
    keep_latest: 2
    keep_best: 3

logging:
  enabled: true
  console_summary: true
  log_file: auto  # "auto" writes to {output_dir}/train.log, or specify a path, or null to disable
  tensorboard:
    enabled: false
    log_dir: null
  wandb:
    enabled: false
    project: llm-100m
    name: null
    entity: null
    tags: []
    group: null
    config: null

runtime_control:
  enabled: true
  control_path: null  # defaults to {output_dir}/runtime_control.yaml
  command_path: null  # defaults to {output_dir}/commands.jsonl
  poll_interval_steps: 10
  # Edit runtime_control.yaml during training to change these on the fly:
  allowed_updates:
    - training.eval_interval
    - training.save_interval
    - training.log_interval
    - training.learning_rate
    - checks.fixed_prompt.enabled
    - checks.fixed_prompt.deterministic
    - checks.fixed_prompt.max_new_tokens
    - checks.fixed_prompt.min_new_tokens
    - checks.fixed_prompt.temperature
    - checks.fixed_prompt.top_p
    - checks.fixed_prompt.top_k
    - checks.fixed_prompt.repetition_penalty
    - checks.fixed_prompt.prompt
    - checks.fixed_prompt.prompt_list
    - checks.fixed_prompt.prompt_list_path

budget:
  target_tokens: 2000000000
  hourly_rate: 0.35
  max_cost: 100.0
  throughput_path: runs/throughput.json

checks:
  overfit_microset:
    enabled: true
    tokens: 5000000
    steps: 100
    eval_batches: 20
    min_drop: 0.3
    target_loss: null
    warmup_steps: 0
    log_interval: 10
    run_on_smoke: false
  fixed_prompt:
    enabled: true
    tokenizer_model: tokenizer/spm.model
    prompt: "The quick brown fox"  # fallback if prompt_list is empty
    prompt_list_path: null
    prompt_list:
      - "The quick brown fox"
      - "Once upon a time,"
      - "The capital of France is"
      - "To solve this problem,"
    deterministic: false  # use sampling for more realistic outputs
    max_new_tokens: 120
    min_new_tokens: 16
    temperature: 1.0
    top_p: 0.95
    top_k: 100
    repetition_penalty: 1.2
    seed: 1337
    output_path: null
    run_on_smoke: false
