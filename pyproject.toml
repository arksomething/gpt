[project]
name = "gpt-training-lab"
version = "0.2.0"
description = "Run controlled language-model experiments from small probes toward 1B parameters."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate",
  "datasets",
  "numpy",
  "pyyaml",
  "sentencepiece",
  "torch",
  "transformers",
  "tqdm",
  "huggingface-hub>=1.3.5",
]

[dependency-groups]
dev = [
  "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["scripts"]

[project.scripts]
ls = "scripts.ls:main"
train = "scripts.train:main"
eval = "scripts.eval:main"
prepare-data = "scripts.prepare_data:main"
check-sources = "scripts.check_sources:main"
gate1-arms = "scripts.gate1_arms:main"
review-corpus = "scripts.review_corpus:main"
publish-corpus = "scripts.publish_corpus:main"
launch-fleet = "scripts.launch_fleet:main"
train-tokenizer = "scripts.train_tokenizer:main"
benchmark = "scripts.benchmark_throughput:main"
tokenizer-repl = "scripts.tokenizer_repl:main"
scan-bins = "scripts.scan_bins:main"
infer = "scripts.infer:main"
quick-lm-eval = "scripts.quick_lm_eval:main"
validate-model-ladder = "scripts.validate_model_ladder:main"
experiment = "scripts.experiment_registry:main"
canonical-writing = "scripts.canonical_writing:main"
probe-preflight = "scripts.preflight_probe:main"
run-status = "scripts.run_observer:main"
prepare-chat-data = "scripts.prepare_chat_data:main"
generate-chat-data = "scripts.generate_chat_data:main"
chat-review = "scripts.chat_review:main"
conversation-eval = "scripts.conversation_eval:main"
